<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RoBoard Task Tree</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="task-tree-shell">
    <header class="topbar" aria-label="RoBoard Task Tree">
      <a class="brand" href="/" aria-label="RoBoard">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">RoBoard</span>
      </a>

      <div class="view-toggle" role="group" aria-label="View toggle">
        <button id="view-task-tree" class="btn btn-ghost is-active" type="button">Task Tree</button>
        <button id="view-kanban" class="btn btn-ghost" type="button">Kanban</button>
      </div>

      <div class="topbar-right" aria-label="Task controls">
        <span id="session-label" class="session-label is-hidden" aria-live="polite"></span>
        <button id="settings-btn" class="btn btn-ghost" type="button" aria-label="Settings" title="Settings">
          <span class="settings-icon">⚙️</span>
        </button>
        <button id="logout-btn" class="btn btn-ghost is-hidden" type="button" data-i18n="taskTree.logout">Logout</button>

        <button id="add-task-btn" class="btn btn-primary add-task-btn is-hidden" type="button" aria-label="Add new task" title="Add new task">
          <span class="add-task-icon">+</span>
        </button>
      </div>
    </header>

    <main id="task-tree-view" class="task-tree-main" aria-label="Task Tree">
      <div class="task-tree-container">
        <section id="task-tree-section" class="task-tree-panel" aria-label="Task Tree">
          <div class="panel-head">
            <h2 class="panel-title" data-i18n="taskTree.title">Task Tree</h2>
            <span id="task-connection-pill" class="status-pill neutral" aria-label="Connection status" data-i18n="taskTree.statusIdle">Idle</span>
          </div>

          <div id="task-tree-content" class="task-tree-content">
            <div id="task-tree-root" class="task-tree-root" role="tree" aria-label="Task hierarchy">
              <div class="task-tree-empty-state" data-i18n="taskTree.empty">No tasks yet. Create a new task to get started.</div>
            </div>
          </div>

          <p id="task-message" class="panel-message" role="status" aria-live="polite"></p>
        </section>

        <section id="task-details-section" class="task-details-panel is-hidden" aria-label="Task details">
          <div class="panel-head">
            <h3 class="panel-title" id="task-details-title" data-i18n="taskTree.detailsTitle">Task Details</h3>
            <button id="close-details-btn" class="btn btn-ghost" type="button" aria-label="Close details">×</button>
          </div>

          <div class="task-details-content">
            <div class="task-status-section">
              <h4 class="section-title" data-i18n="taskTree.status">Status</h4>
              <div id="task-status-display" class="status-display"></div>
            </div>

            <div class="task-sop-section">
              <h4 class="section-title" data-i18n="taskTree.sop">SOP</h4>
              <div id="task-sop-display" class="sop-display"></div>
            </div>

            <div class="task-chat-section">
              <h4 class="section-title" data-i18n="taskTree.chat">Chat</h4>
              <div id="task-chat-messages" class="chat-messages"></div>
              <form id="task-chat-form" class="chat-form">
                <input 
                  id="task-chat-input" 
                  type="text" 
                  placeholder="Type a message..." 
                  data-i18n-placeholder="taskTree.chatPlaceholder"
                  autocomplete="off"
                />
                <button type="submit" class="btn btn-primary" data-i18n="taskTree.send">Send</button>
              </form>
            </div>
          </div>
        </section>
      </div>
    </main>

    <main id="kanban-view" class="kanban-view is-hidden" aria-label="Kanban Board">
      <div class="kanban-container">
        <div id="kanban-content" class="kanban-content"></div>
      </div>
    </main>

    <div id="add-task-modal" class="modal is-hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-overlay"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modal-title" class="modal-title" data-i18n="taskTree.createTask">Create New Task</h2>
          <button id="close-modal-btn" class="btn btn-ghost modal-close" type="button" aria-label="Close modal">×</button>
        </div>
        
        <form id="add-task-form" class="ui-form">
          <label for="task-input-nl" data-i18n="taskTree.inputLabel">Task Description</label>
          <textarea
            id="task-input-nl"
            name="input_nl"
            rows="4"
            placeholder="Describe what you want this task to accomplish..."
            data-i18n-placeholder="taskTree.inputPlaceholder"
            spellcheck="false"
            required
          ></textarea>

          <div class="ui-row ui-row-single">
            <button type="submit" class="btn btn-primary" data-i18n="taskTree.create">Create Task</button>
            <button type="button" id="cancel-task-btn" class="btn btn-ghost" data-i18n="taskTree.cancel">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <div id="settings-modal" class="modal is-hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="modal-overlay"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="settings-title" class="modal-title">Settings</h2>
          <button id="close-settings-btn" class="btn btn-ghost modal-close" type="button" aria-label="Close settings">×</button>
        </div>

        <div class="settings-section">
          <h3>Language</h3>
          <p>Choose display language.</p>
          <div class="lang-toggle" role="group" aria-label="Language">
            <button id="lang-zh" class="btn btn-ghost" type="button">中文</button>
            <button id="lang-en" class="btn btn-ghost" type="button">English</button>
          </div>
        </div>
      </div>
    </div>

    <button id="floating-create-btn" class="floating-create-btn" type="button" aria-label="Quick create">
      <span class="floating-create-icon">+</span>
    </button>

    <div id="quick-composer" class="quick-composer is-hidden">
      <input id="quick-composer-input" type="text" placeholder="Quick create task..." />
      <button id="quick-composer-submit" class="btn btn-primary" type="button">Create</button>
    </div>

    <script>
      (() => {
        var floatingCreateBtn = document.getElementById("floating-create-btn");
        var quickComposer = document.getElementById("quick-composer");
        if (!floatingCreateBtn || !quickComposer) {
          return;
        }

        floatingCreateBtn.addEventListener("click", () => {
          quickComposer.classList.toggle("is-hidden");
        });
      })();
    </script>
    <script src="app.js" defer></script>
  </body>
</html>
