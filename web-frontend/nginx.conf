server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Serve the cockpit at "/".
  location = / {
    try_files /index.html =404;
  }

  # Dedicated login route without ".html" suffix.
  location = /login {
    try_files /login.html =404;
  }

  location = /login/ {
    try_files /login.html =404;
  }

  # Static assets.
  location / {
    try_files $uri $uri/ =404;
  }
}
