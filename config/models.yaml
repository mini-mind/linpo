# Models configuration for agent-framework
# Each model defines provider, authentication, and capabilities

models:
  ark-code-latest:
    provider: volcengine
    model_id: ark-code-latest
    # Project-specific authentication via environment variables
    api_key:
      env: ARK_API_KEY
    base_url:
      env: ARK_BASE_URL
    capabilities:
      chat_completion: true
      streaming: true
      json_mode: true
      tool_use: true
    parameters:
      temperature:
        default: 0.7
        min: 0.0
        max: 1.0
      max_tokens:
        default: 4096
        min: 1
        max: 32768
      top_p:
        default: 0.9
        min: 0.0
        max: 1.0

defaults:
  # Default model for all agents unless overridden
  model: ark-code-latest
