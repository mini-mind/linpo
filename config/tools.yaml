# Tools configuration for agent-framework
# Each tool defines its implementation method, endpoints, and authentication

tools:
  web.search:
    type: http
    method: POST
    # MCP server endpoint for web search
    url_env: MCP_URL
    path: /search
    headers:
      X-Internal-Key:
        env: INTERNAL_API_KEY
    parameters:
      query:
        type: string
        required: true
      limit:
        type: integer
        required: false
    output_schema:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              url:
                type: string
              content:
                type: string

  browser.run:
    type: http
    method: POST
    # Playwright worker gateway endpoint
    url_env: PLAYWRIGHT_GATEWAY_URL
    path: /run
    headers:
      X-Internal-Key:
        env: INTERNAL_API_KEY
    parameters:
      tenant_id:
        type: string
        required: true
      task_id:
        type: string
        required: true
      job:
        type: object
        required: true
    output_schema:
      type: object
      properties:
        success:
          type: boolean
        result:
          type: any
        error:
          type: string
        logs:
          type: array
