[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "linpo"
version = "0.1.0"
description = "Linpo minimal FastAPI bootstrap"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "bcrypt>=4.0.1,<4.1.0",
  "cryptography>=45.0.0,<46.0.0",
  "fastapi>=0.111.0,<1.0.0",
  "psycopg[binary]>=3.2.0,<4.0.0",
  "sqlalchemy>=2.0.14,<2.1.0",
  "uvicorn>=0.41.0,<1.0.0",
  "websockets>=15.0.1,<16.0.0",
]

[project.optional-dependencies]
dev = [
  "basedpyright>=1.31.0,<2.0.0",
  "httpx>=0.27.0,<1.0.0",
  "pytest>=8.2.0,<10.0.0",
]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
