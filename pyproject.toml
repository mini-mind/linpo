[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "linpo"
version = "0.1.0"
description = "Linpo minimal FastAPI bootstrap"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "basedpyright>=1.31.0,<2.0.0",
  "httpx>=0.27.0,<1.0.0",
  "pytest>=8.2.0,<10.0.0",
  "PyYAML>=6.0.0,<7.0.0",
  "types-PyYAML>=6.0.12,<7.0.0",
]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
