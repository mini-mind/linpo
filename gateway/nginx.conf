worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Use Docker embedded DNS (127.0.0.11) with 10s TTL to prevent stale upstream IPs
    # when containers restart. Variable-based proxy_pass below forces re-resolution.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_x_request_id $req_id {
        default $http_x_request_id;
        "" $request_id;
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    map $http_x_forwarded_host $forwarded_host {
        default $http_x_forwarded_host;
        "" $host;
    }

    limit_req_zone $binary_remote_addr zone=api_ratelimit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    server {
        listen 80;

        add_header X-Request-ID $req_id always;

        location / {
            set $frontend_upstream http://web-frontend:80;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $forwarded_host;
            proxy_set_header X-Request-ID $req_id;
        }

        location = /api/health {
            set $api_upstream http://api-backend:8000/health;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $forwarded_host;
            proxy_set_header X-Request-ID $req_id;
        }

        location /api/ {
            limit_req zone=api_ratelimit burst=20 nodelay;
            limit_conn conn_limit 20;
            client_max_body_size 1m;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            set $api_upstream http://api-backend:8000;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $forwarded_host;
            proxy_set_header X-Request-ID $req_id;
        }

        location /ws/ {
            limit_conn conn_limit 20;
            proxy_read_timeout 3600s;

            set $api_upstream http://api-backend:8000;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $forwarded_host;
            proxy_set_header X-Request-ID $req_id;
        }
    }
}
