services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env.deploy
    environment:
      LINPO_DATABASE_URL: ${LINPO_DATABASE_URL:-sqlite:////data/linpo.db}
    volumes:
      - linpo_data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health').read()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "4173:80"

volumes:
  linpo_data:
