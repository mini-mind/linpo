services:
  api:
    build:
      context: ./api
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/roboard}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - ADMIN_API_KEY=${ADMIN_API_KEY:?set}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?set}
      - ALLOW_ORIGINS=${ALLOW_ORIGINS:-*}
      - RATE_LIMIT=${RATE_LIMIT:-100/minute}
      - DISPATCH_URL=${DISPATCH_URL:-http://dispatch:7000}
      - SMTP_HOST=${SMTP_HOST:-mailhog}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-false}
      - SMTP_FROM=${SMTP_FROM:-no-reply@localhost}
      - DEFAULT_NOTIFICATION_EMAIL=${DEFAULT_NOTIFICATION_EMAIL:-demo@example.com}
      - EMAIL_POLL_INTERVAL_SEC=${EMAIL_POLL_INTERVAL_SEC:-2}
      - EMAIL_MAX_ATTEMPTS=${EMAIL_MAX_ATTEMPTS:-3}
      - LLM_GATEWAY_URL=${LLM_GATEWAY_URL:-http://llm-gateway:7300}
      - LLM_DEFAULT_MODEL=${LLM_DEFAULT_MODEL:-}
      - ROBOARD_SOP_ROOT=${ROBOARD_SOP_ROOT:-/app/sops}
    volumes:
      - ./shared/config:/app/config:ro
      - ./shared/prompts:/app/prompts:ro
      - ./shared/agent-templates:/app/templates:ro
      - ./ops/data/sops-runtime:/app/sops
      - ./shared/sops/templates:/app/sops/templates:ro
    ports:
      - "127.0.0.1:8005:8000"
      - "0.0.0.0:8000:8000"
    depends_on:
      - postgres
      - redis
      - mcp-server
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          (command -v curl >/dev/null 2>&1 && curl -fsS http://localhost:8000/health >/dev/null)
          || (command -v wget >/dev/null 2>&1 && wget -qO- http://localhost:8000/health >/dev/null)
          || (python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()" >/dev/null 2>&1)
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app-net
    restart: unless-stopped

  dispatch:
    build:
      context: ./dispatch
    environment:
      # MVP guardrail: per-tenant concurrent runs cap (reserved for future wiring).
      - TENANT_CONCURRENCY_LIMIT=2
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?set}
      - WORKER_URL=${WORKER_URL:-http://worker-playwright:7100}
      - API_BACKEND_URL=${API_BACKEND_URL:-http://api:8000}
      - SKILL_GATEWAY_URL=${SKILL_GATEWAY_URL:-http://skill-gateway:7400}
      # Redis Streams consumer configuration
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DISPATCH_STREAM=${DISPATCH_STREAM:-queue:dispatch}
      - DISPATCH_DEAD_STREAM=${DISPATCH_DEAD_STREAM:-queue:dispatch:dead}
      - DISPATCH_GROUP=${DISPATCH_GROUP:-dispatch}
      - DISPATCH_MAX_ATTEMPTS=${DISPATCH_MAX_ATTEMPTS:-3}
      - LLM_GATEWAY_URL=${LLM_GATEWAY_URL:-http://llm-gateway:7300}
      - LLM_DEFAULT_MODEL=${LLM_DEFAULT_MODEL:-}
    depends_on:
      - api
      - redis
    networks:
      - app-net
    restart: unless-stopped

  worker-playwright:
    build:
      context: ./browser/worker-playwright
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?set}
      - WORKER_URL=${WORKER_URL:-http://worker-playwright:7100}
      - API_BACKEND_URL=${API_BACKEND_URL:-http://api:8000}
      - MCP_URL=${MCP_URL:-http://mcp-server:9000}
      - PLAYWRIGHT_GATEWAY_URL=${PLAYWRIGHT_GATEWAY_URL:-}
    depends_on:
      - dispatch
      - redis
      - mcp-server
    networks:
      - app-net
    restart: unless-stopped

  skill-gateway:
    build:
      context: ./internal/skill-gateway
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?set}
      - SKILL_RUNNER_IMAGE=${SKILL_RUNNER_IMAGE:-}
    networks:
      - app-net
    restart: unless-stopped

  sandbox-template:
    build:
      context: ./internal/sandbox-template
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?set}
    networks:
      - app-net
    restart: unless-stopped

  mcp-server:
    build:
      context: ./internal/mcp-server
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?set}
      - WORKER_URL=${WORKER_URL:-http://worker-playwright:7100}
      - API_BACKEND_URL=${API_BACKEND_URL:-http://api:8000}
      # 本地开发如需测试，手动设置 SEARXNG_URL 环境变量
    depends_on:
      - redis
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          (command -v curl >/dev/null 2>&1 && curl -fsS http://localhost:9000/health >/dev/null)
          || (command -v wget >/dev/null 2>&1 && wget -qO- http://localhost:9000/health >/dev/null)
          || (python -c "import urllib.request; urllib.request.urlopen('http://localhost:9000/health').read()" >/dev/null 2>&1)
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app-net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=roboard
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379" # Local-only by default
    volumes:
      - redis-data:/data
    networks:
      - app-net
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - app-net
    restart: unless-stopped

  llm-gateway:
    build:
      context: ./internal/llm-gateway
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?set}
      - LLM_PROVIDERS_PATH=/run/secrets/llm-providers.json
    volumes:
      - ${LLM_PROVIDERS_HOST_PATH:-./shared/config/llm-providers.example.json}:/run/secrets/llm-providers.json:ro
    expose:
      - "7300"
    networks:
      - app-net
    restart: unless-stopped



networks:
  app-net:
    driver: bridge

volumes:
  redis-data:
  postgres-data:
  caddy-data:
  caddy-config:
