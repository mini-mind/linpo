worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Use Docker embedded DNS (127.0.0.11) with 10s TTL to prevent stale upstream IPs
    # when containers restart. Variable-based proxy_pass below forces re-resolution.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_x_request_id $req_id {
        default $http_x_request_id;
        "" $request_id;
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    map $http_x_forwarded_host $forwarded_host {
        default $http_x_forwarded_host;
        "" $host;
    }

    limit_req_zone $binary_remote_addr zone=api_ratelimit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    include /etc/nginx/conf.d/*.conf;
}
