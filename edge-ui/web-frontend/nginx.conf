server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Serve the web frontend at "/".
  location = / {
    add_header Cache-Control "no-store" always;
    try_files /index.html =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store" always;
    try_files /index.html =404;
  }

  # Dedicated login route without ".html" suffix.
  location = /login {
    add_header Cache-Control "no-store" always;
    try_files /login.html =404;
  }

  location = /login/ {
    add_header Cache-Control "no-store" always;
    try_files /login.html =404;
  }

  location = /login.html {
    add_header Cache-Control "no-store" always;
    try_files /login.html =404;
  }

  # Template library page
  location = /templates {
    add_header Cache-Control "no-store" always;
    try_files /templates.html =404;
  }

  location = /templates/ {
    add_header Cache-Control "no-store" always;
    try_files /templates.html =404;
  }

  location = /templates.html {
    add_header Cache-Control "no-store" always;
    try_files /templates.html =404;
  }

  location = /templates.js {
    add_header Cache-Control "no-cache" always;
    try_files /templates.js =404;
  }

  location = /templates.css {
    add_header Cache-Control "no-cache" always;
    try_files /templates.css =404;
  }

  location = /app.js {
    add_header Cache-Control "no-cache" always;
    try_files /app.js =404;
  }

  location = /style.css {
    add_header Cache-Control "no-cache" always;
    try_files /style.css =404;
  }

  # Static assets.
  location / {
    try_files $uri $uri/ =404;
  }
}
