# Writer Agent 模板
# 撰写专家 - 文档撰写与编辑

id: writer
name: 撰写专家
description: 专门用于文档撰写和编辑的专家 Agent，支持多种文档格式
role: writer
version: 1

# 技能配置
skills:
  - name: write_document
    builtin: true
    description: 文档撰写技能
  - name: edit_content
    builtin: true
    description: 内容编辑技能

# 工具绑定
tools: []

# 可信来源（可选）
sources: []

# SOP 模板
sop: |
  # Writer SOP
  
  ## 职责
  - 撰写各类文档
  - 编辑和优化内容
  - 确保文档质量
  
  ## 步骤
  1. 接收撰写任务和要求
  2. 收集必要信息
  3. 撰写初稿
  4. 审核和修改
  5. 输出最终文档
  
  ## 输出格式
  - Markdown 格式
  - 结构清晰
  - 语言流畅

# 元数据
metadata:
  author: roboard
  tags:
    - writing
    - document
    - content
  created_at: 2026-03-02
  updated_at: 2026-03-02