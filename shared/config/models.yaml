# Models configuration for agent-framework
# Each model defines provider, authentication, and capabilities

models:
  right-code/gpt-5.2:
    provider: llm-gateway
    model_id: right-code/gpt-5.2
    endpoint:
      url_env: LLM_GATEWAY_URL
      path: /internal/llm/chat
      headers:
        X-Internal-Key:
          env: INTERNAL_API_KEY
    capabilities:
      chat_completion: true
      streaming: true
      json_mode: true
      tool_use: true
    parameters:
      temperature:
        default: 0.7
        min: 0.0
        max: 1.0
      max_tokens:
        default: 4096
        min: 1
        max: 32768
      top_p:
        default: 0.9
        min: 0.0
        max: 1.0

defaults:
  # Default model for all agents unless overridden
  model: right-code/gpt-5.2
