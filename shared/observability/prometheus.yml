global:
  scrape_interval: 15s

rule_files:
  - '/etc/prometheus/alert.rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'api'
    static_configs:
      - targets: ['api:8000']
        labels:
          job: 'api'
    honor_labels: true
    metrics_path: '/metrics'

  - job_name: 'dispatch'
    static_configs:
      - targets: ['dispatch:7000']
        labels:
          job: 'dispatch'
    honor_labels: true
    metrics_path: '/metrics'
