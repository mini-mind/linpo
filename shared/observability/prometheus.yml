global:
  scrape_interval: 15s

rule_files:
  - '/etc/prometheus/alert.rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'api-backend'
    static_configs:
      - targets: ['api-backend:8000']
        labels:
          job: 'api-backend'
    honor_labels: true
    metrics_path: '/metrics'

  - job_name: 'agent-manager'
    static_configs:
      - targets: ['agent-manager:7000']
        labels:
          job: 'agent-manager'
    honor_labels: true
    metrics_path: '/metrics'
